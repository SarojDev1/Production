<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Bermuda Drop Map</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#1a1a1a;
  color:white;
}

.header{
  background:#222;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  background:#222;
}

input, select, button{
  padding:10px;
  border-radius:6px;
  border:none;
}

select{
  background:#333;
  color:white;
}

button{
  background:#28a745;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.download-btn{
  background:#007bff;
}

.map-container{
  display:flex;
  justify-content:center;
  padding:20px;
}

.map{
  position:relative;
  width:900px;
  height:900px;
  background:url("https://i.postimg.cc/HsdDvbmn/IMG-7352.jpg") center/cover no-repeat;
  overflow:hidden;
}

.team-marker{
  position:absolute;
  transform:translate(-50%,-50%);
}

.team-logo{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #28a745;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

@media(max-width:950px){
  .map{
    width:95vw;
    height:95vw;
  }

  .team-logo{
    width:45px;
    height:45px;
  }
}
</style>
</head>

<body>

<div class="header">FREE FIRE BERMUDA DROP MAP</div>

<div class="controls">
  <input type="file" id="logoInput" accept="image/*">

  <select id="location">
    <option value="peak">Peak</option>
    <option value="clocktower">Clock Tower</option>
    <option value="factory">Factory</option>
    <option value="pochinok">Pochinok</option>
    <option value="mill">Mill</option>
    <option value="riverside">Riverside</option>
    <option value="shipyard">Shipyard</option>
    <option value="graveyard">Graveyard</option>
    <option value="bullseye">Bullseye</option>
    <option value="hangar">Hangar</option>
    <option value="observatory">Observatory</option>
    <option value="rimnam">Rim Nam</option>
    <option value="marselectric">Mars Electric</option>
    <option value="katulistiwa">Katulistiwa</option>
    <option value="plantation">Plantation</option>
    <option value="bimasakti">Bimasakti Strip</option>
    <option value="capetown">Cape Town</option>
    <option value="kotatua">Kota Tua</option>
    <option value="keraton">Keraton</option>
    <option value="sentosa">Sentosa</option>
  </select>

  <button onclick="addLogo()">Add Team</button>
  <button onclick="clearMap()">Clear Map</button>
  <button class="download-btn" onclick="downloadMap()">Download Pic</button>
</div>

<div class="map-container">
  <div class="map" id="map"></div>
</div>

<script>
const places = {
  shipyard:{x:45,y:13},
  bullseye:{x:28,y:22},
  graveyard:{x:22,y:35},
  observatory:{x:10,y:45},
  hangar:{x:22,y:63},
  rimnam:{x:12,y:84},
  clocktower:{x:36,y:60},
  factory:{x:47,y:70},
  pochinok:{x:58,y:77},
  marselectric:{x:53,y:90},
  katulistiwa:{x:35,y:40},
  bimasakti:{x:47,y:48},
  plantation:{x:53,y:35},
  peak:{x:61,y:58},
  riverside:{x:62,y:32},
  mill:{x:75,y:36},
  keraton:{x:87,y:42},
  capetown:{x:88,y:60},
  kotatua:{x:76,y:68},
  sentosa:{x:87,y:82}
};

const locationCount = {};

function addLogo(){
  const file = document.getElementById("logoInput").files[0];

  if(!file){
    alert("Please select team logo first");
    return;
  }

  const location = document.getElementById("location").value;

  if(!locationCount[location]){
    locationCount[location] = 0;
  }

  const count = locationCount[location];
  locationCount[location]++;

  const radius = count === 0 ? 0 : 42;
  const angle = count * 60 * Math.PI / 180;

  const offsetX = Math.cos(angle) * radius;
  const offsetY = Math.sin(angle) * radius;

  const reader = new FileReader();

  reader.onload = function(e){
    const marker = document.createElement("div");
    marker.className = "team-marker";

    marker.style.left = `calc(${places[location].x}% + ${offsetX}px)`;
    marker.style.top = `calc(${places[location].y}% + ${offsetY}px)`;

    marker.innerHTML = `<img src="${e.target.result}" class="team-logo">`;

    document.getElementById("map").appendChild(marker);
  };

  reader.readAsDataURL(file);
}

function clearMap(){
  document.getElementById("map").innerHTML = "";

  for(let key in locationCount){
    locationCount[key] = 0;
  }
}

function downloadMap(){
  const map = document.getElementById("map");

  html2canvas(map,{
    useCORS:true,
    backgroundColor:null,
    scale:2
  }).then(canvas=>{
    const link = document.createElement("a");
    link.download = "bermuda-drop-map.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
</script>

</body>
</html>
